    \ 0\n  - text: \"No\"\n    correct: error != 0\n\nsolution: >\n  Substitute x\
    \ = {{ solution }} into the left-hand side:\n  {{ a }} × {{ solution }} + {{ b\
    \ }} = {{ a*solution }} + {{ b }} = {{ a*solution + b }}.\n\n  The right-hand\
    \ side is {{ rhs }}.\n\n  Since the left-hand side is **{{ a*solution + b }}**\
    \ and the right-hand side is **{{ rhs }}**,\n  the correct answer is **{{ \"Yes\"\
    \ if error == 0 else \"No\" }}**.\n"
