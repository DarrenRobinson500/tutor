    \  m: item[0]\n  b: item[1]\n  target: item[2]\n  x_sol: item[3]\n  step1:\n \
    \   expr: item[2] - item[1]\n\nquestion:\n  text: 'The graph of **y = {{ m }}x\
    \ + {{ b }}** is drawn. Find the x-value where **y = {{ target }}** by solving\
    \ the equation algebraically.'\n  parts:\n    - text: 'Subtract {{ b }} from both\
    \ sides of {{ target }} = {{ m }}x + {{ b }}. {{ target }} - {{ b }} = ?'\n  \
    \    answer: step1\n      solution: '{{ target }} - {{ b }} = {{ step1 }}'\n \
    \   - text: 'So {{ step1 }} = {{ m }}x. Divide both sides by {{ m }}. x = {{ step1\
    \ }} / {{ m }} = ?'\n      answer: x_sol\n      solution: 'x = {{ step1 }} / {{\
    \ m }} = {{ x_sol }}. The graph crosses y = {{ target }} at x = {{ x_sol }}.'\n\
    \nanswers: []\nsolution: \"\"\ndiagram: none\nvalidation: []\n"
