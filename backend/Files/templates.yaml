    \ > 0\r\n\r\nquestion:\r\n  text: |\r\n    {{ name }} is shopping at a market.\
    \ Apples cost {{ apple_price }} per kg and oranges cost {{ orange_price }} per\
    \ kg. {{ name }} buys {{ apple_kg }} kg of apples and {{ orange_kg }} kg of oranges.\
    \ At the register, a loyalty card gives a {{ discount | percent }} discount on\
    \ the total.\r\n    {{ name }} pays with {{ payment }}.\r\n  parts:\r\n    - text:\
    \ \"What is the cost of the apples? \\n(Multiply the cost per kg by the number\
    \ of kg)\"\r\n      answer: \"{{ apple_cost }}\"\r\n      solution: \"{{ apple_kg\
    \ }} × {{ apple_price | dollar }} = {{ apple_cost | dollar }}\"\r\n      format_instruction:\
    \ \"Enter the dollar amount as a number, e.g. 12.50\"\r\n\r\n    - text: \"What\
    \ is the cost of the oranges?\"\r\n      answer: \"{{ orange_cost }}\"\r\n   \
    \   solution: \"{{ orange_kg }} × {{ orange_price | dollar }} = {{ orange_cost\
    \ | dollar }}\"\r\n      format_instruction: \"Enter the dollar amount as a number,\
    \ e.g. 12.50\"\r\n\r\n    - text: \"What is the cost of the apples and oranges\
    \ together?\"\r\n      answer: \"{{ subtotal }}\"\r\n      solution: \"{{ apple_cost\
    \ | dollar }} + {{ orange_cost | dollar }} = {{ subtotal | dollar }}\"\r\n   \
    \   format_instruction: \"Enter the dollar amount as a number, e.g. 12.50\"\r\n\
    \r\n    - text: \"How much is saved with the loyalty discount? (Multiply the loyalty\
    \ discount by the cost of the apples and oranges)\"\r\n      answer: \"{{ discount_amount\
    \ }}\"\r\n      solution: \"{{ discount }} of {{ subtotal | dollar }} = {{ subtotal\
    \ | dollar }} × {{ discount }} = {{ discount_amount | dollar }}\"\r\n      format_instruction:\
    \ \"Enter the dollar amount as a number, e.g. 12.50\"\r\n\r\n    - text: \"What\
    \ is the final price after the discount?\"\r\n      answer: \"{{ total }}\"\r\n\
