  content: "title: Calculate distance saved by a direct route\r\nyears: 7\r\ndifficulty:\
    \ medium\r\nparameters:\r\n  a:\r\n    min: 10\r\n    max: 20\r\n  b:\r\n    min:\
    \ 15\r\n    max: 25\r\nquestion:\r\n  text: To get from point A to point C, a\
    \ motorist must drive via point B. The distance\r\n    from A to B is {{ a }}\
    \ km. The distance from B to C is {{ b }} km. If a road was built directly from\
    \ A to C, how much distance will be taken\r\n    off the trip?\r\nanswers:\r\n\
    - input: '{{ a + b - sqrt(a**2 + b**2) }}'\r\n  correct: true\r\n  tolerance:\
    \ 0.1\r\n  format_instruction: Enter the distance in km, e.g. 10.1\r\nsolution:\r\
    \n  text: 'The direct distance from A to C can be calculated using the Pythagorean\
    \ theorem:\r\n    $\\sqrt{{{ a }^2 + { b }^2 }}$. The distance saved is the original\
    \ distance minus\r\n    the direct distance: ${{ a }} + {{ b }} - \\sqrt{{{ a\
    \ }^2 + { b }^2 }} = {{ a +\r\n    b - sqrt(a**2 + b**2) }}$ km.'\r\ndiagram:\
    \ \r\n  'Line(a: (0, 0), b: ({{ a }}, 0), label_a: \"A\", label_b: \"B\", label_m:\
    \ {{ a}}); \r\n  Line(a: ({{ a }}, 0), b: ({{ a }}, {{ b }}), label_b: \"C\",\
    \ label_m: \"{{ b }}\")'\r\n\r\n"
