    \n  subtotal: apple_cost + orange_cost\r\n  discount:\r\n    type: percent\r\n\
    \    size: small\r\n  discount_amount: subtotal * discount\r\n  total: subtotal\
    \ - discount_amount\r\n  payment:\r\n    type: dollar\r\n    min: 60\r\n    max:\
