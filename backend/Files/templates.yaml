    \ to answer each question.\r\n  parts:\r\n  - text: Two rectangles are similar.\
    \ The first is {{ width1 }} cm wide and {{ length1\r\n      }} cm long. The second\
    \ is {{ width2 }} cm wide. Find the length of the second\r\n      rectangle.\r\
    \n    answer: '{{ (length1 / width1) * width2 }}'\r\n    solution: 'The rectangles\
    \ are similar, so the ratio of the lengths is the same as the ratio of the widths:\
    \ \\( \\frac{{{ length1 }}}{{{ width1 }}} = \\frac{l}{{{ width2 }}} \\). Solving\
    \ for \\(\r\n   l \\), we get \\( l = \\frac{{{ length1 }}}{{{ width1 }}} \\times\
    \ {{ width2 }} = {{ (length1 / width1) * width2 }} \\) cm.'\r\n  - text: A tree\
    \ casts a {{ shadow_tree }} m shadow, whilst a man {{ height_man }}\r\n      cm\
    \ tall casts a {{ shadow_man }} cm shadow at the same time. How tall is the tree?\r\
    \n    answer: '{{ (shadow_tree / shadow_man) * height_man }}'\r\n    solution:\
    \ 'The tree and the man form similar triangles with their shadows. Thus, \\( \\\
    frac{{{ height_man }}}{{{ shadow_man }}} = \\frac{h}{{{ shadow_tree }}} \\). Solving\
    \ for \\( h \\), we get \\( h = \\frac{{{ shadow_tree }}}{{{ shadow_man }}} \\\
    times {{ height_man }} = {{ (shadow_tree / shadow_man) * height_man }} \\) m.'\r\
    \nanswers: []\r\nsolution: ''\r\ndiagram: none\r\n\r\nvalidation:\r\n  rules:\r\
    \n    - check: \"width1 != width2\"\r\n      message: \"make it interesting\"\r\
