    \ constant speed and changing speed\"\r\nparameters:\r\n  speed1:\r\n    min:\
    \ 15\r\n    max: 40\r\n    step: 5\r\n  speed3:\r\n    min: 15\r\n    max: 40\r\
    \n    step: 5\r\n  t1: \r\n    size: small\r\n  t_rest: \r\n    size: small\r\n\
    \  t3:\r\n    size: small\r\n  d1: speed1 * t1\r\n  d3: speed3 * t3\r\n\r\n\r\n\
    question:\r\n  text: 'A journey has three sections: Section 1 travels {{ d1 }}\
    \ km in {{ t1 }} hours. Section 2 is a rest for {{ t_rest }} hours. Section 3\
    \ travels a further {{ d3 }} km in {{ t3 }} hours.'\r\n  parts:\r\n    - text:\
    \ 'In Section 1, the object is moving. Speed = distance / time. What is the speed\
    \ in Section 1?'\r\n      answer: speed1\r\n      solution: 'Speed = {{ d1 }}km\
    \ / {{ t1 }}h = {{ speed1 }} km/h'\r\n    - text: In Section 2 the line is flat\
    \ (horizontal). The distance does not change. What is the speed during Section\
    \ 2?\r\n      answer: 0\r\n      solution: 'A flat section means distance is not\
    \ changing, so speed = 0 km/h. The object is at rest.'\r\n    - text: 'What is\
    \ the speed in section 3?'\r\n      answer: speed3\r\n      solution: 'Section\
    \ 3 speed = {{ d3 }} / {{ t3 }} = {{ speed3 }} km/h'\r\n\r\ndiagram: 'GraphLine(points:\
    \ [(0, 0), ({{t1}}, {{d1}}), ({{t1+t_rest}}, {{d1}}), ({{t1+t_rest+t3}}, {{d1+d3}})],\
    \ x_label: \"Time (hours)\", y_label: \"Distance (km)\")'\r\nvalidation: []\r\n"
