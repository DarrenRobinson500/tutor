    \ solution + c)\n\nquestion:\n  text: >\n    Solve the equation:\n    **{{ a }}({{\
    \ b }}x + {{ c }}) = {{ rhs }}**\n\nanswer: \"{{ solution }}\"\n\nsolution: >\n\
