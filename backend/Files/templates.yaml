    \ r1*r2\n  p:\n    expr: -(r1 + r2)\n  q:\n    expr: r1 * r2\n\nquestion:\n  text:\n\
    \    \"Determine the two values of x by factorising this quadratic equation: \n\
    \n\n      x^2 + {{ p }}x + {{ q }} = 0\"\n\nanswer: \"{{ r1 }}, {{ r2 }}\"\n\n\
    solution: >\n  Factorise:\n  $$(x - {{ r1 }})(x - {{ r2 }}) = 0.$$\n  Therefore\
    \ the solutions are x = {{ r1 }} and x = {{ r2 }}.\n"
