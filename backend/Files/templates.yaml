  curriculum: []
  content: "parameters:\n  a:\n    size: small        # coefficient of x on LHS (2–5)\n\
    \  c:\n    size: small        # coefficient of x on RHS (2–5)\n\n  solution:\n\
    \    size: small        # the intended integer solution for x\n\n  b:\n    size:\
    \ small        # constant on LHS\n\n  # Construct d so that the equation a*x +\
    \ b = c*x + d has the chosen solution\n  # From: a*solution + b = c*solution +\
    \ d  →  d = a*solution + b - c*solution\n  d:\n    expr: a * solution + b - c\
    \ * solution\n\nvalidation:\n  - \"{{ a != c }}\"\n\nquestion:\n  text: >\n  \
    \  Solve the equation:\n    **{{ a }}x + {{ b }} = {{ c }}x + {{ d }}**\n\nsolution:\
    \ >\n  Subtract {{ c }}x from both sides:\n  {{ a - c }}x + {{ b }} = {{ d }}.\n\
    \  Then subtract {{ b }}:\n  {{ a - c }}x = {{ d - b }}.\n  Finally divide both\
    \ sides by {{ a - c }}:\n  x = {{ solution }}.\n\nanswer: \"{{ solution }}\""
