  content: "question:\r\n  text: Classify each of the following as a Rate or Ratio.\r\
    \n  parts:\r\n    - text: \"A bag contains 3 red marbles and 7 blue marbles. The\
    \ comparison is 3:7. Is this a ratio or a rate\"\r\n      choices:\r\n       \
    \ - text: \"Ratio\"\r\n          correct: true\r\n        - text: \"Rate\"\r\n\
    \          correct: false\r\n      solution: Both quantities are marbles. Same\
    \ unit → Ratio. Written as 3:7.\r\n\r\n    - text: \"A car travels 180 km in 3\
    \ hours. Is this a ratio or a rate\"\r\n      choices:\r\n        - text: \"Ratio\"\
    \r\n          correct: false\r\n        - text: \"Rate\"\r\n          correct:\
    \ true\r\n      solution: Distance (km) divided by time (hours) gives a new unit\
    \ km/h → Rate. The car travels at 60 km/h.\r\n\r\n    - text: A recipe uses 2\
    \ cups of sugar for every 5 cups of flour.\r\n      choices:\r\n        - text:\
    \ \"Ratio\"\r\n          correct: true\r\n        - text: \"Rate\"\r\n       \
    \   correct: false\r\n      solution: Both quantities are measured in cups. Same\
    \ unit → Ratio. Written as 2:5. This one is tricky — it looks like a rate but\
    \ the units are the same.\r\n\r\n    - text: A shop charges $4.50 per kilogram\
    \ of apples.\r\n      choices:\r\n        - text: \"Ratio\"\r\n          correct:\
    \ false\r\n        - text: \"Rate\"\r\n          correct: true\r\n      solution:\
    \ Price (dollars) divided by weight (kg) gives $/kg → Rate.\r\n\r\n    - text:\
    \ In a class the ratio of girls to boys is 3:2.\r\n      choices:\r\n        -\
    \ text: \"Ratio\"\r\n          correct: true\r\n        - text: \"Rate\"\r\n \
    \         correct: false\r\n\r\n      solution: Both quantities count people.\
    \ Same unit → Ratio. Written as 3:2.\r\n\r\n    - text: A heart beats 72 times\
    \ per minute.\r\n      choices:\r\n        - text: \"Ratio\"\r\n          correct:\
    \ false\r\n        - text: \"Rate\"\r\n          correct: true\r\n      solution:\
    \ Count (beats) divided by time (minutes) gives beats/min → Rate.\r\npost_answer:\
    \ '{{ Knowledge(\"Rate vs Ratio\") }}'\r\n"
