  content: "parameters:\r\n  a_num:\r\n    min: 1\r\n    max: 9\r\n  a_den:\r\n  \
    \  min: 10\r\n    max: 20\r\n  a_comp:\r\n    expr: a_den - a_num\r\n  b_num:\r\
    \n    min: 1\r\n    max: 9\r\n  b_den:\r\n    min: 10\r\n    max: 20\r\n  b_comp:\r\
    \n    expr: b_den - b_num\r\n  s:\r\n    type: scenario\r\n    rows:\r\n     \
    \ - [\"winning a prize in a draw\", \"not winning a prize\", \"a machine producing\
    \ a faulty item\", \"producing a working item\"]\r\n      - [\"a student being\
    \ chosen as class captain\", \"not being chosen\", \"a bus arriving late\", \"\
    arriving on time\"]\r\n      - [\"drawing a red card from a shuffled deck\", \"\
    drawing a black card\", \"a customer making a complaint\", \"not making a complaint\"\
    ]\r\n      - [\"selecting a ripe piece of fruit\", \"selecting an unripe piece\"\
    , \"a randomly chosen person preferring coffee\", \"preferring tea or another\
    \ drink\"]\r\n\r\nvalidation:\r\n  - a_num < a_den\r\n  - b_num < b_den\r\n\r\n\
    question:\r\n  text: \"Use the complement rule P(not A) = 1 − P(A) to answer each\
    \ part.\"\r\n  parts:\r\n    - text: \"The probability of {{ s[0] }} is {{ a_num\
    \ }}/{{ a_den }}. What is the probability of {{ s[1] }}?\"\r\n      answer: \"\
    {{ a_comp }}/{{ a_den }}\"\r\n      solution: \"P({{ s[1] }}) = 1 − {{ a_num }}/{{\
    \ a_den }} = {{ a_comp }}/{{ a_den }}\"\r\n    - text: \"The probability of {{\
    \ s[2] }} NOT occurring is {{ b_comp }}/{{ b_den }}. What is the probability of\
    \ it occurring?\"\r\n      answer: \"{{ b_num }}/{{ b_den }}\"\r\n      solution:\
    \ \"P(occurring) = 1 − P(not occurring) = 1 − {{ b_comp }}/{{ b_den }} = {{ b_num\
    \ }}/{{ b_den }}\"\r\n    - text: \"An event has probability {{ a_num }}/{{ a_den\
    \ }}. What must the probability of its complementary event be for the two probabilities\
    \ to sum to 1?\"\r\n      answer: \"{{ a_comp }}/{{ a_den }}\"\r\n      solution:\
    \ \"P(A) + P(not A) = 1, so P(not A) = 1 − {{ a_num }}/{{ a_den }} = {{ a_comp\
    \ }}/{{ a_den }}\"\r\n\r\ndiagram: none\r\n"
