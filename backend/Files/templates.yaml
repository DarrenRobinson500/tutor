    parameters:\n  item:\n    type: scenario\n    rows:\n      - [2, 1, 7, 3, 6]\n\
    \      - [3, 2, 8, 2, 6]\n      - [2, 3, 9, 3, 6]\n      - [4, 1, 9, 2, 8]\n \
