  content: "title: Interpreting a Line Graph of Distance vs Time\r\nyears: 7\r\ndifficulty:\
    \ medium\r\nparameters:\r\n  speed1:\r\n    min: 20\r\n    max: 50\r\n    step:\
    \ 10\r\n  speed2:\r\n    min: 80\r\n    max: 100\r\n    step: 10\r\n  breakpoint:\r\
    \n    value: 20\r\nquestion:\r\n  text: Use the graph to answer each question.\r\
    \n  parts:\r\n  - text: How far had John walked after 10 minutes?\r\n    answer:\
    \ '{{ 10 * speed1 }}'\r\n    tolerance: 100\r\n    solution: Looking at the graph,\
    \ find 10 minutes on the x-axis, go up to the line, then find the distance on\
    \ the y axis which is {{ 10 * speed1 }} metres.\r\n  - text: How long did it take\
    \ John to walk 3400 metres?\r\n    answer: '{{ (3400 - speed1 * 20) / speed2 +\
    \ 20 }}'\r\n    tolerance: 3\r\n    solution: Reading the graph, start at 3400,\
    \ and read across to find the line, then drop straight down to get to the time\
    \ on the x-axis. This gives {{ (3400 - speed1 * 20) / speed2 + 20 }}\r\n  - text:\
    \ After how many minutes did John start walking faster?\r\n    answer: 20\r\n\
    \    tolerance: 1\r\n    solution: John changed his speed at the {{ breakpoint\
    \ }} minute mark.\r\n  - text: After John started walking faster, how many metres\
    \ did he walk every 10 minutes?\r\n    answer: '{{ 10 * speed2 }}'\r\n    tolerance:\
    \ 100\r\n    solution: Distance = speed × time = {{ speed2 }} × 5 = {{ 5 * speed2\
    \ }} metres.\r\n  - text: What was John’s speed for the faster part of his walk\
    \ (in meters per minute)\r\n    answer: '{{ speed2 }}'\r\n    tolerance: 10\r\n\
    \    solution: John's speed increased to {{ speed2 }} m/min after {{ breakpoint\
    \ }}\r\n      minutes.\r\nanswers: []\r\nsolution: ''\r\ndiagram: 'GraphLine(points:\
    \ [(\"0\", 0), (\"10\", {{ 10 * speed1 }}), (\"20\", {{ 20 * speed1 }}),  (\"\
    30\", {{ 20 * speed1 + (30 - 20) * speed2 }})(\"40\", {{ 20 * speed1 + (40 - 20)\
    \ * speed2 }})(\"50\", {{ 20 * speed1 + (50 - 20) * speed2 }})], y_label: \"Metres\"\
    , show_values: false)'\r\nskill_id: 48\r\n"
