<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Response to your feedback</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F5F0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F5F0;">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,0.08);">

          <!-- HEADER -->
          <tr>
            <td style="background-color:#E87722;padding:32px;border-radius:10px 10px 0 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td valign="middle">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="36" height="36" align="center" valign="middle"
                            style="width:36px;height:36px;background-color:#F09A42;border-radius:8px;text-align:center;vertical-align:middle;line-height:36px;">
                          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                               xmlns="http://www.w3.org/2000/svg"
                               style="display:inline-block;vertical-align:middle;">
                            <path d="M14 4H6L10 10L6 16H14"
                                  stroke="#ffffff" stroke-width="2.2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td valign="middle" style="padding-left:10px;">
                    <span style="color:#ffffff;font-size:16px;font-weight:500;font-family:Arial,Helvetica,sans-serif;line-height:1;white-space:nowrap;">Subject Matter</span>
                  </td>
                </tr>
              </table>

              <p style="margin:20px 0 6px 0;padding:0;color:#F9DDC8;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;line-height:1.4;">
                Re: Your Feedback
              </p>
              <p style="margin:0;padding:0;color:#ffffff;font-size:26px;font-weight:500;font-family:Arial,Helvetica,sans-serif;line-height:1.3;">
                We&#8217;ve responded to your feedback.
              </p>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="background-color:#ffffff;padding:28px 32px;">

              <p style="margin:0 0 20px 0;padding:0;font-size:15px;color:#666666;font-family:Arial,Helvetica,sans-serif;line-height:1.65;">
                Hi [FIRST_NAME],
              </p>

              <!-- Original feedback -->
              <p style="margin:0 0 8px 0;padding:0;font-size:13px;font-weight:600;color:#999999;text-transform:uppercase;letter-spacing:0.05em;font-family:Arial,Helvetica,sans-serif;">
                Your feedback
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
                <tr>
                  <td style="background-color:#F8F7F4;border-radius:8px;padding:14px 16px;border-left:3px solid #D0CEC9;">
                    <p style="margin:0;padding:0;font-size:14px;color:#555555;font-family:Arial,Helvetica,sans-serif;line-height:1.65;font-style:italic;">[ORIGINAL_FEEDBACK]</p>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #E8E8E4;padding:0 0 20px 0;font-size:0;line-height:0;">&#8203;</td></tr>
              </table>

              <!-- Response -->
              <p style="margin:0 0 8px 0;padding:0;font-size:13px;font-weight:600;color:#E87722;text-transform:uppercase;letter-spacing:0.05em;font-family:Arial,Helvetica,sans-serif;">
                Our response
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px;">
                <tr>
                  <td style="background-color:#FFF8F2;border-radius:8px;padding:14px 16px;border-left:3px solid #E87722;">
                    <p style="margin:0;padding:0;font-size:15px;color:#333333;font-family:Arial,Helvetica,sans-serif;line-height:1.7;">[RESPONSE]</p>
                  </td>
                </tr>
              </table>

              <!-- CTA -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="background-color:#E87722;border-radius:6px;padding:11px 28px;">
                          <a href="https://www.subject-matter.com.au"
                             style="color:#ffffff;font-size:14px;font-weight:600;font-family:Arial,Helvetica,sans-serif;text-decoration:none;white-space:nowrap;letter-spacing:0.01em;">
                            Go to my dashboard &#8594;
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #E8E8E4;padding:0 0 16px 0;font-size:0;line-height:0;">&#8203;</td></tr>
              </table>

              <p style="margin:0;padding:0;font-size:13px;color:#999999;font-family:Arial,Helvetica,sans-serif;text-align:center;line-height:1.55;">
                Questions? Just reply to this email &#8212; we&#8217;re here to help.
              </p>

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="border-top:1px solid #E8E8E4;padding:16px 32px;background-color:#ffffff;border-radius:0 0 10px 10px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size:12px;color:#9E9E9E;font-family:Arial,Helvetica,sans-serif;">The Subject Matter Team</td>
                  <td align="right" style="font-size:12px;color:#9E9E9E;font-family:Arial,Helvetica,sans-serif;text-align:right;">NSW Maths Tutoring</td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
