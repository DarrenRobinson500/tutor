<svg viewBox="0 0 600 410" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFCA3A"/>
    </linearGradient>
    <linearGradient id="sunGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFCA3A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF8C42" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#FFFBF5" style="fill:rgb(255, 251, 245);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ═══════════ MARK ═══════════ -->
  <rect x="248" y="88" width="104" height="80" rx="20" fill="url(#sunGrad)" filter="url(#softShadow)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="272,164 258,186 290,164" fill="url(#sunGrad)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="270" y1="116" x2="330" y2="116" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(0, 0, 0);stroke-width:3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="270" y1="130" x2="318" y2="130" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(0, 0, 0);stroke-width:3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="270" y1="144" x2="324" y2="144" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(0, 0, 0);stroke-width:3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ═══════════ WORDMARK ═══════════ -->
  <!-- Shift both words up slightly to close the gap left by dot removal -->
  <text x="300" y="234" text-anchor="middle" font-family="'Trebuchet MS', 'Gill Sans', Optima, Verdana, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#2D2D2D" style="fill:rgb(45, 45, 45);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Trebuchet MS&quot;, &quot;Gill Sans&quot;, Optima, Verdana, sans-serif;font-size:34px;font-weight:700;text-anchor:middle;dominant-baseline:auto">Subject</text>

  <text x="300" y="270" text-anchor="middle" font-family="'Trebuchet MS', 'Gill Sans', Optima, Verdana, sans-serif" font-size="34" font-weight="400" letter-spacing="4" fill="#FF8C42" style="fill:rgb(255, 140, 66);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Trebuchet MS&quot;, &quot;Gill Sans&quot;, Optima, Verdana, sans-serif;font-size:34px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Matter</text>

  <rect x="196" y="279" width="208" height="3" rx="1.5" fill="url(#sunGradH)" opacity="0.3" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Tagline -->
  <text x="300" y="312" text-anchor="middle" font-family="'Trebuchet MS', 'Gill Sans', Optima, Verdana, sans-serif" font-size="11" font-weight="400" letter-spacing="2.5" fill="#2D2D2D" opacity="0.4" style="fill:rgb(45, 45, 45);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.4;font-family:&quot;Trebuchet MS&quot;, &quot;Gill Sans&quot;, Optima, Verdana, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">NSW maths tutoring · built for families</text>

</svg>